<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf4ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<title>澳洲 · 越南 自由行手册｜2026.09.25 – 10.06</title>
<style>
:root{
  --bg:#f6f1e8; --paper:#fffdf8; --ink:#232a30; --sub:#6b7078; --line:#ddd3c2;
  --accent:#c2410c; --accent-soft:#fde8dc; --ok:#0f766e; --ok-soft:#d7f0ed;
  --warn:#92400e; --warn-soft:#fdf0d5; --danger:#9f1239; --danger-soft:#fde8ef;
  --flight:#1d4ed8; --flight-soft:#e2e9ff; --shadow:0 1px 3px rgba(60,45,25,.10);
  --mapsea:#e8eef4; --mapland:#f3e6cf;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181d; --paper:#1c2229; --ink:#e7ecef; --sub:#9aa4ad; --line:#2e373f;
    --accent:#fb923c; --accent-soft:#3a2416; --ok:#5eead4; --ok-soft:#12332f;
    --warn:#fcd34d; --warn-soft:#3a2f12; --danger:#fda4af; --danger-soft:#3d1d27;
    --flight:#93b4ff; --flight-soft:#1b2740; --shadow:0 1px 3px rgba(0,0,0,.4);
    --mapsea:#1e2a33; --mapland:#33291c;
  }
}
html[data-theme="light"]{
  --bg:#f6f1e8; --paper:#fffdf8; --ink:#232a30; --sub:#6b7078; --line:#ddd3c2;
  --accent:#c2410c; --accent-soft:#fde8dc; --ok:#0f766e; --ok-soft:#d7f0ed;
  --warn:#92400e; --warn-soft:#fdf0d5; --danger:#9f1239; --danger-soft:#fde8ef;
  --flight:#1d4ed8; --flight-soft:#e2e9ff; --shadow:0 1px 3px rgba(60,45,25,.10);
  --mapsea:#e8eef4; --mapland:#f3e6cf;
}
html[data-theme="dark"]{
  --bg:#14181d; --paper:#1c2229; --ink:#e7ecef; --sub:#9aa4ad; --line:#2e373f;
  --accent:#fb923c; --accent-soft:#3a2416; --ok:#5eead4; --ok-soft:#12332f;
  --warn:#fcd34d; --warn-soft:#3a2f12; --danger:#fda4af; --danger-soft:#3d1d27;
  --flight:#93b4ff; --flight-soft:#1b2740; --shadow:0 1px 3px rgba(0,0,0,.4);
  --mapsea:#1e2a33; --mapland:#33291c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.62;padding:16px 13px 60px;-webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto}
a{color:inherit}
/* ---------- header ---------- */
.hero{text-align:center;padding:6px 0 18px;position:relative}
.hero h1{font-size:21px;letter-spacing:.5px}
.hero .dates{color:var(--sub);font-size:13px;margin-top:3px}
.hero .route{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.themeBtn{position:absolute;right:0;top:0;background:var(--paper);border:1px solid var(--line);
  color:var(--sub);font-size:11px;padding:5px 9px;border-radius:999px;cursor:pointer}
/* ---------- now card ---------- */
.now{background:linear-gradient(160deg,var(--accent-soft),var(--paper));border:1px solid var(--line);
  border-radius:16px;padding:16px 15px;margin-bottom:18px;box-shadow:var(--shadow)}
.now .label{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}
.now .evt{font-size:16px;font-weight:700;margin-top:5px}
.now .when{font-size:12.5px;color:var(--sub);margin-top:3px}
.cd{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.cd .u{flex:1;min-width:62px;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  text-align:center;padding:8px 2px}
.cd .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.cd .t{font-size:10.5px;color:var(--sub);letter-spacing:1px}
.now .localhint{font-size:11.5px;color:var(--sub);margin-top:9px}
/* ---------- sections ---------- */
section{margin-bottom:22px}
h2{font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:11px}
h2::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
/* ---------- overview map ---------- */
.mapcard{padding:12px 10px 6px}
.mapcard svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px 12px;font-size:11.5px;color:var(--sub)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* ---------- bookings ---------- */
.bkgroup{margin-bottom:12px}
.bktitle{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;margin:0 0 6px}
table.bk{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.bk th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:600;
  padding:8px 10px;background:rgba(125,125,125,.06);border-bottom:1px solid var(--line)}
table.bk td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.bk tr:last-child td{border-bottom:none}
table.bk td.k{font-weight:600;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;
  background:var(--flight-soft);color:var(--flight);font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.dg{background:var(--danger-soft);color:var(--danger)}
.maplink{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--accent);
  text-decoration:underline;text-underline-offset:2px}
.na{color:var(--sub);font-size:12px}
/* ---------- day ---------- */
.day{margin-bottom:12px;border-left:4px solid var(--dc,var(--accent));border-radius:12px;
  background:var(--paper);border:1px solid var(--line);border-left-width:4px;
  border-left-color:var(--dc,var(--accent));box-shadow:var(--shadow);overflow:hidden}
.dhead{padding:12px 13px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.dnum{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--dc);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dnum .dd{font-size:13px;font-weight:800}
.dnum .dw{font-size:9px;opacity:.9}
.dinfo{flex:1;min-width:0}
.dinfo .dt{font-size:14.5px;font-weight:700}
.dinfo .ds{font-size:12px;color:var(--sub);margin-top:2px}
.dinfo .dstay{font-size:11.5px;color:var(--sub);margin-top:4px}
.dopen{flex:0 0 auto;font-size:11px;color:var(--sub);padding-top:4px}
.dbody{display:none;border-top:1px dashed var(--line);padding:4px 0 10px}
.day.open .dbody{display:block}
.day.open .dopen::after{content:" ▴"}
.dopen::after{content:" ▾"}
.daymap{padding:8px 12px 4px}
.daymap svg{width:100%;height:auto;display:block}
.daynav{padding:2px 12px 10px}
.daynav a{display:inline-block;font-size:12px;background:var(--accent);color:#fff;
  padding:7px 12px;border-radius:9px;text-decoration:none;font-weight:600}
.tl{padding:2px 0 0}
.it{display:flex;gap:10px;padding:7px 13px}
.it .tm{flex:0 0 58px;font-size:12px;font-weight:700;color:var(--accent);text-align:right;padding-top:1px;
  font-variant-numeric:tabular-nums}
.it .bd{flex:1;min-width:0;font-size:13.2px}
.it .bd .bt{font-weight:600}
.it .bd .bdsc{font-size:12px;color:var(--sub);margin-top:1px}
.it.book .tm{color:var(--danger)}
.it.flight .tm{color:var(--flight)}
.badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:5px;margin-left:5px;
  vertical-align:1px;font-weight:600}
.badge.bk{background:var(--danger-soft);color:var(--danger)}
.badge.rk{background:var(--warn-soft);color:var(--warn)}
.risk{margin:8px 13px 2px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);
  font-size:12.2px;color:var(--warn);border:1px solid transparent}
.risk b{color:var(--warn)}
/* ---------- todo ---------- */
ul.todo{list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:8px 0;box-shadow:var(--shadow)}
ul.todo li{padding:8px 14px;font-size:13.2px;border-bottom:1px dashed var(--line);display:flex;gap:9px}
ul.todo li:last-child{border-bottom:none}
ul.todo li .dot{flex:0 0 auto;color:var(--accent);font-weight:700}
ul.todo li.hot .dot{color:var(--danger)}
.notehint{font-size:11.5px;color:var(--sub);margin-top:7px}
/* ---------- tips ---------- */
.tips{display:grid;gap:10px;grid-template-columns:1fr}
.tip{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow)}
.tip h3{font-size:13px;margin-bottom:5px}
.tip p{font-size:12.5px;color:var(--sub)}
.tip p+p{margin-top:4px}
.outfits{display:grid;gap:10px;grid-template-columns:1fr}
.outfit{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow)}
.outfit h3{font-size:13.5px;margin-bottom:7px}
.outfit ul{list-style:none;display:grid;gap:5px}
.outfit li{display:flex;gap:8px;font-size:12.8px;align-items:flex-start}
.outfit li .ic{font-size:16px;line-height:1.2;flex:0 0 22px;text-align:center}
.outfit li .tp{flex:1;color:var(--ink)}
.foot{text-align:center;font-size:11px;color:var(--sub);margin-top:22px;line-height:1.7}
@media (min-width:600px){ .tips{grid-template-columns:1fr 1fr} .outfits{grid-template-columns:1fr 1fr} }
@media (max-width:400px){ .it .tm{flex:0 0 50px;font-size:11.5px} .cd .n{font-size:21px} }
</style>
</head>

</div>

/* =======================================================================
   渲染逻辑
   ======================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Google 地图导航链接：单点点→直接导航；多点→origin/waypoints/destination */
const MAPQ = q => encodeURIComponent(q);
function navURL(list){
  if(!list || !list.length) return null;
  const q = list.map(MAPQ);
  if(q.length === 1) return 'https://www.google.com/maps/dir/?api=1&destination=' + q[0] + '&travelmode=transit';
  return 'https://www.google.com/maps/dir/?api=1&origin=' + q[0] +
         '&waypoints=' + q.slice(1,-1).join('%7C') +
         '&destination=' + q[q.length-1] + '&travelmode=transit';
}
const isoTZ = iso => iso.slice(-6);

/* ---------- 此刻关注：倒计时 ---------- */
/* 额外锚点：一日游 / 接驳出发时刻（同样带固定 UTC 偏移） */
const EXTRA_ANCHORS = [
  {iso:'2026-09-30T07:30:00+10:00', name:'丹翠雨林一日游 · 酒店接送', where:'凯恩斯 Crystalbrook Bailey', tz:'UTC+10'},
  {iso:'2026-10-01T07:30:00+10:00', name:'银梭号大堡礁 · 开始接驳', where:'凯恩斯市区 & 北部沙滩', tz:'UTC+10'},
  {iso:'2026-10-03T14:30:00+10:00', name:'普芬比利蒸汽小火车 · 酒店接', where:'墨尔本 Element Richmond', tz:'UTC+10'},
  {iso:'2026-10-04T08:00:00+11:00', name:'大洋路一日游 · 集合', where:'22 Russell St, Richmond', tz:'UTC+11（夏令时）'}
];

function anchors(){
  const a = [];
  FLIGHTS.forEach(f => {
    a.push({iso:f.depISO, name:f.no + ' ' + f.leg + ' 起飞', where:f.from, tz:f.depTz});
  });
  EXTRA_ANCHORS.forEach(e => a.push(e));
  return a.sort((x,y) => new Date(x.iso) - new Date(y.iso));
}
const ANCHORS = anchors();

function updNow(){
  const now = Date.now();
  let cur = null;
  for(const e of ANCHORS){ if(new Date(e.iso).getTime() > now){ cur = e; break; } }
  const box = $('#nowCd'), evt = $('#nowEvt'), when = $('#nowWhen'), hint = $('#nowHint');
  if(!cur){
    evt.textContent = '行程已结束';
    when.textContent = '祝一路平安 🧳';
    box.style.display = 'none'; hint.textContent = '本页为终稿状态，如需改期请重排整个行程。';
    return;
  }
  box.style.display = 'flex';
  const target = new Date(cur.iso).getTime();
  let diff = Math.max(0, target - now);
  const d = Math.floor(diff / 86400000); diff -= d*86400000;
  const h = Math.floor(diff / 3600000);  diff -= h*3600000;
  const m = Math.floor(diff / 60000);    diff -= m*60000;
  const s = Math.floor(diff / 1000);
  evt.textContent = '下一个：' + cur.name;
  const localAbs = new Date(cur.iso);
  when.innerHTML = esc(cur.where || '') + ' · ' +
    esc(localAbs.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})) +
    ' <span style="opacity:.75">（' + esc(cur.tz) + '）</span>';
  box.innerHTML = [['天',d],['时',h],['分',m],['秒',s]]
    .map(([t,v]) => '<div class="u"><div class="n">' + String(v).padStart(2,'0') + '</div><div class="t">' + t + '</div></div>').join('');
  const myTz = -new Date().getTimezoneOffset();
  const sign = myTz >= 0 ? '+' : '-';
  const abs = Math.abs(myTz);
  hint.innerHTML = '你当前时区：UTC' + sign + String(Math.floor(abs/60)).padStart(2,'0') + ':' + String(abs%60).padStart(2,'0') +
    '　·　事件时间已按出发地时区锁定，跨时区打开不会算错';
}

/* ---------- 当日路线小图 ---------- */
function daySVG(day){
  const pts = day.items.filter(i => i.map);
  const n = Math.max(pts.length, 2);
  const W = 680, H = 40 + n * 46;
  let g = '';
  const X = i => 54 + (W - 150) * (n === 1 ? 0 : i / (n - 1));
  const Y = i => 42 + i * 46;
  for(let i = 0; i < n - 1; i++){
    g += '<path d="M' + X(i) + ',' + Y(i) + ' C' + (X(i) + 40) + ',' + (Y(i) + 22) + ' ' +
         (X(i+1) - 40) + ',' + (Y(i+1) - 22) + ' ' + X(i+1) + ',' + Y(i+1) +
         '" fill="none" stroke="' + day.color + '" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" opacity=".8"/>';
  }
  pts.forEach((p, i) => {
    g += '<circle cx="' + X(i) + '" cy="' + Y(i) + '" r="8" fill="' + day.color + '" stroke="#fff" stroke-width="2"/>' +
         '<text x="' + X(i) + '" y="' + (Y(i) + 4) + '" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">' + (i+1) + '</text>' +
         '<text x="' + (X(i) + 15) + '" y="' + (Y(i) + 5) + '" font-size="12.5" font-weight="600" fill="currentColor" opacity=".9">' +
           esc((p.title || '').slice(0, 22)) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="当日路线" font-family="PingFang SC,Microsoft YaHei,sans-serif">' + g + '</svg>';
}

    const rows = d.items.map(i => {
      const cls = 'it' + (i.book ? ' book' : '') + (i.flight ? ' flight' : '');
      let right = '<div class="bt">' + esc(i.title) +
        (i.book ? '<span class="badge bk">需提前订</span>' : '') + '</div>';
      if(i.desc) right += '<div class="bdsc">' + i.desc + '</div>';
      if(i.map) right += '<div><a class="maplink" target="_blank" rel="noopener" href="' + navURL([i.map]) + '">📍 打开导航</a></div>';
      return '<div class="' + cls + '"><div class="tm">' + esc(i.t) + '</div><div class="bd">' + right + '</div></div>';
    }).join('');
    return '<div class="day" data-day="' + d.n + '" style="--dc:' + d.color + '">' +
      '<div class="dhead" role="button" tabindex="0">' +
        '<div class="dnum"><div class="dd">' + esc(d.date) + '</div><div class="dw">' + esc(d.dow) + '</div></div>' +
        '<div class="dinfo"><div class="dt">D' + d.n + ' · ' + esc(d.title) + '</div>' +
          '<div class="ds">' + esc(d.dow) + ' · 第 ' + d.n + ' 天 / 共 12 天</div>' +
          '<div class="dstay">🏨 ' + esc(d.stay) + '</div></div>' +
        '<div class="dopen"></div>' +
      '</div>' +
      '<div class="dbody">' +
        (maps.length ? '<div class="daymap">' + daySVG(d) + '</div>' : '') +
        (dayNav ? '<div class="daynav"><a target="_blank" rel="noopener" href="' + dayNav + '">🧭 一键打开全天多点导航</a></div>' : '') +
        (d.risk ? '<div class="risk">⚠ ' + d.risk + '</div>' : '') +
        '<div class="tl">' + rows + '</div>' +
      '</div></div>';
  }).join('');
  document.querySelectorAll('.dhead').forEach(el => {

  });
}

/* ---------- 配色切换 ---------- */
function initTheme(){
  const btn = $('#themeBtn');
  const KEY = 'auhandbook-theme';
  let saved = 'auto';
  try{ saved = localStorage.getItem(KEY) || 'auto'; }catch(e){}
  const apply = v => {
    document.documentElement.setAttribute('data-theme', v);
    btn.textContent = v === 'auto' ? '◐ 配色' : (v === 'light' ? '☀ 亮色' : '☾ 暗色');
  };
  apply(saved);
  btn.addEventListener('click', () => {
    const seq = ['auto','light','dark'];
    const cur = document.documentElement.getAttribute('data-theme') || 'auto';
    const nx = seq[(seq.indexOf(cur) + 1) % 3];
    apply(nx);
    try{ localStorage.setItem(KEY, nx); }catch(e){}
  });
}
