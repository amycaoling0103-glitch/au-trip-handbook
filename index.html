a{color:inherit}

.hero h1{font-size:21px;letter-spacing:.5px}
.hero .dates{color:var(--sub);font-size:13px;margin-top:3px}

.themeBtn{position:absolute;right:0;top:0;background:var(--paper);border:1px solid var(--line);

.now .when{font-size:12.5px;color:var(--sub);margin-top:3px}
.cd{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.cd .u{flex:1;min-width:62px;background:var(--paper);border:1px solid var(--line);border-radius:11px;

.cd .t{font-size:10.5px;color:var(--sub);letter-spacing:1px}
.now .localhint{font-size:11.5px;color:var(--sub);margin-top:9px}

section{margin-bottom:22px}
h2{font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:11px}
h2::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

.mapcard{padding:12px 10px 6px}

table.bk th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:600;

table.bk td.k{font-weight:600;white-space:nowrap}

.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.dg{background:var(--danger-soft);color:var(--danger)}
.maplink{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--accent);

.na{color:var(--sub);font-size:12px}

.dbody{display:none;border-top:1px dashed var(--line);padding:4px 0 10px}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Google 地图导航链接：单点点→直接导航；多点→origin/waypoints/destination */
const MAPQ = q => encodeURIComponent(q);
function navURL(list){
  if(!list || !list.length) return null;
  const q = list.map(MAPQ);
  if(q.length === 1) return 'https://www.google.com/maps/dir/?api=1&destination=' + q[0] + '&travelmode=transit';
  return 'https://www.google.com/maps/dir/?api=1&origin=' + q[0] +
         '&waypoints=' + q.slice(1,-1).join('%7C') +
         '&destination=' + q[q.length-1] + '&travelmode=transit';
}
const isoTZ = iso => iso.slice(-6);

/* 预订状态标签：状态以「已订」或「已确认」开头都算已订好（容忍带括号的备注，如 已订（Agoda）） */
function stTag(s){
  if(!s) return ' <span class="tag warn">待确认</span>';
  if(s.indexOf('已订') === 0) return ' <span class="tag ok">已订</span>';
  if(s.indexOf('已确认') === 0) return ' <span class="tag ok">已确认</span>';
  return ' <span class="tag warn">待确认</span>';
}

function anchors(){
  const a = [];
  FLIGHTS.forEach(f => {
    a.push({iso:f.depISO, name:f.no + ' ' + f.leg + ' 起飞', where:f.from, tz:f.depTz});
  });
  EXTRA_ANCHORS.forEach(e => a.push(e));
  return a.sort((x,y) => new Date(x.iso) - new Date(y.iso));
}
const ANCHORS = anchors();

function updNow(){
  const now = Date.now();
  let cur = null;
  for(const e of ANCHORS){ if(new Date(e.iso).getTime() > now){ cur = e; break; } }
  const box = $('#nowCd'), evt = $('#nowEvt'), when = $('#nowWhen'), hint = $('#nowHint');
  if(!cur){
    evt.textContent = '行程已结束';
    when.textContent = '祝一路平安 🧳';
    box.style.display = 'none'; hint.textContent = '本页为终稿状态，如需改期请重排整个行程。';
    return;
  }
  box.style.display = 'flex';
  const target = new Date(cur.iso).getTime();
  let diff = Math.max(0, target - now);
  const d = Math.floor(diff / 86400000); diff -= d*86400000;
  const h = Math.floor(diff / 3600000);  diff -= h*3600000;
  const m = Math.floor(diff / 60000);    diff -= m*60000;
  const s = Math.floor(diff / 1000);
  evt.textContent = '下一个：' + cur.name;
  const localAbs = new Date(cur.iso);
  when.innerHTML = esc(cur.where || '') + ' · ' +
    esc(localAbs.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})) +
    ' <span style="opacity:.75">（' + esc(cur.tz) + '）</span>';
  box.innerHTML = [['天',d],['时',h],['分',m],['秒',s]]
    .map(([t,v]) => '<div class="u"><div class="n">' + String(v).padStart(2,'0') + '</div><div class="t">' + t + '</div></div>').join('');
  const myTz = -new Date().getTimezoneOffset();
  const sign = myTz >= 0 ? '+' : '-';
  const abs = Math.abs(myTz);
  hint.innerHTML = '你当前时区：UTC' + sign + String(Math.floor(abs/60)).padStart(2,'0') + ':' + String(abs%60).padStart(2,'0') +
    '　·　事件时间已按出发地时区锁定，跨时区打开不会算错';
}

/* ---------- 当日路线小图 ---------- */
function daySVG(day){
  const pts = day.items.filter(i => i.map);
  const n = Math.max(pts.length, 2);
  const W = 680, H = 40 + n * 46;
  let g = '';
  const X = i => 54 + (W - 150) * (n === 1 ? 0 : i / (n - 1));
  const Y = i => 42 + i * 46;
  for(let i = 0; i < n - 1; i++){
    g += '<path d="M' + X(i) + ',' + Y(i) + ' C' + (X(i) + 40) + ',' + (Y(i) + 22) + ' ' +
         (X(i+1) - 40) + ',' + (Y(i+1) - 22) + ' ' + X(i+1) + ',' + Y(i+1) +
         '" fill="none" stroke="' + day.color + '" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" opacity=".8"/>';
  }
  pts.forEach((p, i) => {
    g += '<circle cx="' + X(i) + '" cy="' + Y(i) + '" r="8" fill="' + day.color + '" stroke="#fff" stroke-width="2"/>' +
         '<text x="' + X(i) + '" y="' + (Y(i) + 4) + '" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">' + (i+1) + '</text>' +
         '<text x="' + (X(i) + 15) + '" y="' + (Y(i) + 5) + '" font-size="12.5" font-weight="600" fill="currentColor" opacity=".9">' +
           esc((p.title || '').slice(0, 22)) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="当日路线" font-family="PingFang SC,Microsoft YaHei,sans-serif">' + g + '</svg>';
}

/* ---------- 逐日 ---------- */
function renderDays(){
  $('#dayBox').innerHTML = DAYS.map(d => {
    const maps = d.items.filter(i => i.map).map(i => i.map);
    const dayNav = maps.length ? navURL(maps) : null;
    const rows = d.items.map(i => {
      const cls = 'it' + (i.book ? ' book' : '') + (i.flight ? ' flight' : '');
      let right = '<div class="bt">' + esc(i.title) +
        (i.book ? '<span class="badge bk">需提前订</span>' : '') + '</div>';
      if(i.desc) right += '<div class="bdsc">' + i.desc + '</div>';
      if(i.map) right += '<div><a class="maplink" target="_blank" rel="noopener" href="' + navURL([i.map]) + '">📍 打开导航</a></div>';
      return '<div class="' + cls + '"><div class="tm">' + esc(i.t) + '</div><div class="bd">' + right + '</div></div>';
    }).join('');
    return '<div class="day" data-day="' + d.n + '" style="--dc:' + d.color + '">' +
      '<div class="dhead" role="button" tabindex="0">' +
        '<div class="dnum"><div class="dd">' + esc(d.date) + '</div><div class="dw">' + esc(d.dow) + '</div></div>' +
        '<div class="dinfo"><div class="dt">D' + d.n + ' · ' + esc(d.title) + '</div>' +
          '<div class="ds">' + esc(d.dow) + ' · 第 ' + d.n + ' 天 / 共 12 天</div>' +
          '<div class="dstay">🏨 ' + esc(d.stay) + '</div></div>' +
        '<div class="dopen"></div>' +
      '</div>' +
      '<div class="dbody">' +
        (maps.length ? '<div class="daymap">' + daySVG(d) + '</div>' : '') +
        (dayNav ? '<div class="daynav"><a target="_blank" rel="noopener" href="' + dayNav + '">🧭 一键打开全天多点导航</a></div>' : '') +
        (d.risk ? '<div class="risk">⚠ ' + d.risk + '</div>' : '') +
        '<div class="tl">' + rows + '</div>' +
      '</div></div>';
  }).join('');
  document.querySelectorAll('.dhead').forEach(el => {
    const tog = () => el.parentElement.classList.toggle('open');
    el.addEventListener('click', tog);

}

/* ---------- 配色切换 ---------- */
function initTheme(){
  const btn = $('#themeBtn');
  const KEY = 'auhandbook-theme';
  let saved = 'auto';
  try{ saved = localStorage.getItem(KEY) || 'auto'; }catch(e){}
  const apply = v => {
    document.documentElement.setAttribute('data-theme', v);
    btn.textContent = v === 'auto' ? '◐ 配色' : (v === 'light' ? '☀ 亮色' : '☾ 暗色');
  };
  apply(saved);
  btn.addEventListener('click', () => {
    const seq = ['auto','light','dark'];
    const cur = document.documentElement.getAttribute('data-theme') || 'auto';
    const nx = seq[(seq.indexOf(cur) + 1) % 3];
    apply(nx);
    try{ localStorage.setItem(KEY, nx); }catch(e){}
  });
}
